<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Task-Inject</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header>
      <div class="logo">
        <span class="logo-accent">Task</span>-Inject
      </div>
      <div class="status-badge" id="status-badge">タスクなし</div>
    </header>

    <main>
      <div class="input-section">
        <form id="task-form">
          <input 
            type="text" 
            id="task-input" 
            placeholder="新しい学習・フォーカスしたいタスクを入力..." 
            required 
            autocomplete="off"
          >
          <button type="submit" id="add-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </form>
      </div>
      
      <!-- 再生数下限設定 -->
      <div class="settings-section">
        <label for="min-views-input" class="settings-label">最低再生数フィルター</label>
        <div class="settings-input-wrapper">
          <input type="number" id="min-views-input" placeholder="制限なし" min="0" step="1000">
          <span class="settings-unit">回以上</span>
        </div>
      </div>

      <div class="task-list-section">
        <div class="section-title">
          <span>現在のフォーカス</span>
          <span class="task-count" id="task-count">0</span>
        </div>
        <ul id="task-list">
          <!-- タスクアイテムが動的に挿入されます -->
        </ul>
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">🎯</div>
          <p class="empty-text">タスクが設定されていません</p>
          <p class="empty-subtext">タスクを登録して、YouTubeのおすすめフィードを自分好みにハックしましょう！</p>
        </div>
      </div>
    </main>

    <footer>
      <p class="footer-note">ノー・ブロック原則: 利便性はそのままに、環境をハックする</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
